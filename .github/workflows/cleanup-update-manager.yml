name: Cleanup merged update-manager branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = "heads/feature/update-manager";
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              core.info("Deleted " + ref);
            } catch (error) {
              if (error.status === 404) {
                core.info("Branch already deleted");
              } else {
                throw error;
              }
            }
