name: Temporary cleanup updater telemetry branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-clean-telemetry.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/pulls/80" --jq '.merged')" = "true"
          branch="feat/updater-real-telemetry"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
          ! gh api "repos/$repo/branches/$branch" >/dev/null 2>&1
