name: Temporary PR 58 cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-history-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 58});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'feat/github-updater-history-polling' ||
                pr.data.head.sha !== '9e25e64e559feca6669a6b936adacf25df2d2d5b') {
              core.setFailed('Unexpected PR state; deletion refused'); return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/feat/github-updater-history-polling'});
