name: Temporary delete merged Cloud.ru branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-delete-cloudru-branch.yml']
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR and delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/pulls/72" --jq '.merged')" = "true"
          branch="feat/cloudru-ai-provider"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
          ! gh api "repos/$repo/branches/$branch" >/dev/null 2>&1
