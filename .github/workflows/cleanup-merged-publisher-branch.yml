name: Temporary merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-publisher-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged PR 49 branch
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 49});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'fix/publisher-trust-provisioning' ||
                pr.data.head.sha !== '28de527e1217d98498ea06a0459564768f9a7d03') {
              core.setFailed('PR #49 is not the expected merged PR; no branch deleted');
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/fix/publisher-trust-provisioning'
              });
              core.info('Deleted merged branch fix/publisher-trust-provisioning');
            } catch (e) {
              if (e.status === 422 || e.status === 404) {
                core.info('Branch already absent');
              } else {
                throw e;
              }
            }
