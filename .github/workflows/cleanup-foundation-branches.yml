name: Cleanup merged foundation branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged foundation refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          delete_ref() {
            local branch="$1"
            local encoded="${branch//\//%2F}"
            local status
            status="$(curl -sS -o /tmp/delete-response -w "%{http_code}"               -X DELETE               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded")"

            if [[ "$status" != "204" && "$status" != "404" ]]; then
              cat /tmp/delete-response
              echo "Failed to delete $branch (HTTP $status)"
              exit 1
            fi
            echo "$branch: deleted or already absent"
          }

          delete_ref "foundation/p0-bootstrap"
          delete_ref "foundation/p1-hardening"
