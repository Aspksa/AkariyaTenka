name: Temporary delete merged fix branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-delete-fix-branch.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR 70 is merged and delete exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          merged=$(gh api "repos/$repo/pulls/70" --jq '.merged')
          test "$merged" = "true"
          branch="fix/github-update-install-flow"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            echo "Branch still exists" >&2
            exit 1
          fi
          echo "Deleted or already absent: $branch"
