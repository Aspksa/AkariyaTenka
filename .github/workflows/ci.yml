name: Akariya Tenka CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Launcher syntax
        run: node --check scripts/launch.mjs && node --check scripts/apply-update.mjs && node --check scripts/build-server.mjs && node --check scripts/workspace-health.mjs
      - name: PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/bootstrap-node.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Runtime smoke
        run: npm run smoke
      - name: Production launcher smoke
        env:
          AKARIYA_LAUNCHER_SMOKE: "1"
        run: npm start -- --no-open --skip-checks --port 4273
      - name: Development launcher smoke
        env:
          AKARIYA_LAUNCHER_SMOKE: "1"
        run: npm run dev -- --no-open --skip-checks --port 4373
      - name: Fresh ZIP BAT and portable Node smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "akariya-launcher-smoke.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Akariya Tenka Fresh ZIP"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          git archive --format=zip HEAD -o $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

          $system32 = Join-Path $env:SystemRoot "System32"
          $env:PATH = "$system32;$env:SystemRoot;$(Join-Path $system32 'WindowsPowerShell\\v1.0')"
          $env:AKARIYA_LAUNCHER_SMOKE = "1"

          Push-Location $env:RUNNER_TEMP
          try {
            & (Join-Path $destination "AKARIYA.bat") --no-open --skip-checks --port 4473
            if ($LASTEXITCODE -ne 0) { throw "AKARIYA.bat failed with exit code $LASTEXITCODE" }
            $portableNode = Join-Path $destination ".runtime\\node\\node.exe"
            if (-not (Test-Path $portableNode)) { throw "Portable Node.js was not installed" }
            & $portableNode -e "process.exit(process.versions.node === '22.23.3' ? 0 : 1)"
            if ($LASTEXITCODE -ne 0) { throw "Portable Node.js version verification failed" }
          }
          finally {
            Pop-Location
          }
