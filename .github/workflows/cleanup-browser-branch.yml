name: Temporary PR 52 cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-browser-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 52});
            if (!pr.data.merged || pr.data.base.ref !== 'main' || pr.data.head.ref !== 'fix/windows-default-browser-launch' ||
                pr.data.head.sha !== 'a8af7adca72f1a9219f853592ac27898c655b8a0') {
              core.setFailed('Unexpected PR state; refusal to delete'); return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/fix/windows-default-browser-launch'});
