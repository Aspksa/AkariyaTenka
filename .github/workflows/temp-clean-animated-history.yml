name: Temporary cleanup animated history branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-clean-animated-history.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged animation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/pulls/85" --jq '.merged')" = "true"
          branch="feat/animated-git-statistics"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
