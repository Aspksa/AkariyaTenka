name: Temporary PR 51 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-feature-removal-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 51 });
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'refactor/remove-transfer-updates-publisher-keys' ||
                pr.data.head.sha !== '033ed8487f2d88e40fefb45fc81c4eca5d3497c2') {
              core.setFailed('Unexpected PR state; deletion refused');
              return;
            }
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/refactor/remove-transfer-updates-publisher-keys'
            });
