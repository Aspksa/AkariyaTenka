name: Temporary PR 50 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-runtime-lock-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR 50 branch only
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 50});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'fix/recover-stale-runtime-lock' ||
                pr.data.head.sha !== 'b296ea3948bb17f5548cd4176c5937ec3ef8c425') {
              core.setFailed('Unexpected PR state; refusing deletion');
              return;
            }
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/fix/recover-stale-runtime-lock'
            });
