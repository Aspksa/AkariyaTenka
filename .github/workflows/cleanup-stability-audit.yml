name: Temporary stability audit cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stability-audit.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 63});
            if (!pr.data.merged || pr.data.head.ref !== 'fix/updater-stability-audit' ||
                pr.data.head.sha !== 'ac7a0abe97755dea68131a0ae4e8cb30c525e6ed') {
              core.setFailed('Unexpected branch state'); return;
            }
            await github.rest.git.deleteRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/fix/updater-stability-audit'});
