name: Temporary PR 59 cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-one-click-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 59});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'fix/one-click-update-experience' ||
                pr.data.head.sha !== '92b5a8a4dc0f54003a954aa5f0ecdc17190b97f8') {
              core.setFailed('Unexpected PR state; deletion refused');
              return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/fix/one-click-update-experience'});
