name: Temporary PR 53 cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-github-check-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 53});
            if (!pr.data.merged || pr.data.base.ref !== 'main' || pr.data.head.ref !== 'feat/github-update-check' ||
                pr.data.head.sha !== '11ed59f32003668532c3cdcae9719542e7470199') {
              core.setFailed('Unexpected PR state; refusal to delete'); return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/feat/github-update-check'});
