name: Temporary PR 54 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-updater-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 54});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'feat/supervised-github-updater' ||
                pr.data.head.sha !== 'd84d9fba2dde071078d4ec4ac1576654df0d5cad') {
              core.setFailed('Unexpected PR state; deletion refused');
              return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/feat/supervised-github-updater'});
