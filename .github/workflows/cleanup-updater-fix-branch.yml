name: Temporary PR 55 cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-updater-fix-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 55});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'fix/github-updater-startup-confirmation' ||
                pr.data.head.sha !== '89527327cf2c7c6b1b5813abbf4d577ff5cd7c9a') {
              core.setFailed('Unexpected PR state; deletion refused'); return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/fix/github-updater-startup-confirmation'});
