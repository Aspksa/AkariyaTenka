name: Temporary UI feature branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-personalized-ui.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 65});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'feat/personalized-ui-and-notifications' ||
                pr.data.head.sha !== '42ebbef1898d69a07582c28958b680777fc4dcf8') {
              core.setFailed('Unexpected PR state; deletion refused'); return;
            }
            await github.rest.git.deleteRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/feat/personalized-ui-and-notifications'});
