name: Temporary sidebar branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-sidebar-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:64});
            if (!pr.data.merged || pr.data.head.ref !== 'feat/collapsible-sidebar' ||
                pr.data.head.sha !== 'c8c174a7bba3ea156a81df3ed4694b7236d3218c') {
              core.setFailed('Unexpected PR state'); return;
            }
            await github.rest.git.deleteRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/feat/collapsible-sidebar'});
