name: Refresh secure toolchain lockfile

on:
  push:
    branches: [foundation/p3-operational-hardening]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore: refresh secure toolchain lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: foundation/p3-operational-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Refresh package metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@8.3.4 vitest@5.0.4
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: refresh secure toolchain lockfile"
          git push origin HEAD:foundation/p3-operational-hardening
