name: Cleanup merged operational-hardening branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/foundation/p3-operational-hardening"
              });
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
            }
