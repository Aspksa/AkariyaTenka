name: Temporary delete merged assistant branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-delete-assistant-branch.yml']
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged PR and delete exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/pulls/71" --jq '.merged')" = "true"
          branch="feat/assistant-brain-chat"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
          ! gh api "repos/$repo/branches/$branch" >/dev/null 2>&1
