name: Temporary manual rollback branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-manual-rollback-branches.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 62});
            if (!pr.data.merged || pr.data.base.ref !== 'main' ||
                pr.data.head.ref !== 'feat/manual-rollback-controls' ||
                pr.data.head.sha !== '25fb39e52e9b6d3377c75b54ec1f17ddbffac67c') {
              core.setFailed('Unexpected PR state; refusing cleanup');
              return;
            }
            await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/feat/manual-rollback-controls'});
            const old = await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/feat/one-click-manual-rollback'});
            if(old.data.object.sha === '64bdc3649ef10354bfa0cdbb415deb0b40d81d3b') {
              await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/feat/one-click-manual-rollback'});
            }
