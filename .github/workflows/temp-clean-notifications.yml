name: Temporary cleanup unified notifications branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-clean-notifications.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged notifications branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/pulls/77" --jq '.merged')" = "true"
          branch="fix/unified-notification-bell"
          if gh api "repos/$repo/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          fi
          ! gh api "repos/$repo/branches/$branch" >/dev/null 2>&1
